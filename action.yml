---
name: PRune
description: Normalize PR descriptions to paragraph style

runs:
  using: composite
  steps:
    - name: Normalize description
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const body = pr.body || '';

          if (!/##\s*Summary/i.test(body)) {
            core.info('No ## Summary section found. Skipping.');
            return;
          }

          const summaryMatch = body.match(/##\s*Summary\s*\n([\s\S]*?)(?=\n##|$)/i);
          const testingMatch = body.match(/##\s*Testing\s*\n([\s\S]*?)(?=\n##|$)/i);

          if (!summaryMatch) {
            core.info('No ## Summary section found. Skipping.');
            return;
          }

          const bullets = summaryMatch[1]
            .split(/\r?\n/)
            .map(l => l.replace(/^[-*]\s*/, '').replace(/^#+\s*/, '').trim())
            .filter(Boolean);

          function wrapTech(text) {
            text = text.replace(
              /(?<!`)(\b[\w.-]+\.(yml|rs|toml|md|json|sh|ts|js|py)\b)(?!`)/g,
              '`$1`'
            );
            text = text.replace(/(?<!`)(\-\-[\w-]+)/g, '`$1`');
            text = text.replace(/\(([^)]+\/[^)]+)\)/g, (_, inner) => {
              const wrapped = inner.split('/').map(t => '`' + t.trim() + '`').join('/');
              return '(' + wrapped + ')';
            });
            text = text.replace(/'([^']+)'/g, '`$1`');
            return text;
          }

          const summarySentence = bullets.map(b => wrapTech(b.endsWith('.') ? b : b + '.')).join(' ');

          const testingLines = testingMatch ? testingMatch[1].split(/\r?\n/).filter(Boolean) : [];
          const testingSentence = testingLines.length
            ? testingLines.map(l => wrapTech(l.endsWith('.') ? l : l + '.')).join(' ')
            : 'Pre-commit (`fmt`/`clippy`/`check`/`yaml`) covered the changes.';

          const botCommands = '\n<details>\n<summary>Available Bot Commands</summary>\n\n**Cancel Runs:**\n- `/cancel-runs`\n- `/cancel-runs help`\n\n**Rust Auto-Fix:**\n- `/rust-fix fmt`\n- `/rust-fix clippy`\n- `/rust-fix all`\n\n</details>';
          const newBody = summarySentence + ' ' + testingSentence + botCommands;

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            body: newBody,
          });

          core.info('PR #' + pr.number + ' normalized');